<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h4><i class="fas fa-money-bill-wave"></i> Crear Pago</h4>
          </div>
          <div class="card-body">
            <form [formGroup]="pagoForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="alquilerId" class="form-label">ID de Alquiler</label>
                <input type="text" id="alquilerId" class="form-control" formControlName="alquilerId" required>
              </div>
              <div class="mb-3">
                <label for="monto" class="form-label">Monto</label>
                <input type="number" id="monto" class="form-control" formControlName="monto" required>
              </div>
              <div class="mb-3">
                <label for="metodoPago" class="form-label">Método de Pago</label>
                <select id="metodoPago" class="form-select" formControlName="metodoPago" required>
                  <option value="transferencia">mercadoPago</option>
                  <option value="efectivo">Efectivo</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="fechaPago" class="form-label">Fecha de Pago</label>
                <input type="date" id="fechaPago" class="form-control" formControlName="fechaPago" required>
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Guardar Pago
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
