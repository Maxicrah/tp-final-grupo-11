<!-- post-form.component.html -->
<div class="container mt-4">
    <div class="card">
      <div class="card-header bg-primary text-white">
        Post a Promotion
      </div>
      <div class="card-body">
        <form [formGroup]="postForm" (ngSubmit)="postToFacebook()">
          <div class="form-group">
            <textarea formControlName="message" class="form-control" rows="3" placeholder="Type your promotion..."></textarea>
            <div *ngIf="postForm.get('message')?.invalid && postForm.get('message')?.touched" class="text-danger">
              Message is required and cannot be empty.
            </div>
          </div>
          <div class="form-group">
            <input formControlName="imageUrl" type="text" class="form-control" placeholder="Enter image URL (e.g., https://example.com/image.jpg)">
            <div *ngIf="postForm.get('imageUrl')?.invalid && postForm.get('imageUrl')?.touched" class="text-danger">
              Please enter a valid image URL (must end with .png or .jpg).
            </div>
          </div>
          <button type="submit" class="btn btn-primary mr-2" [disabled]="postForm.invalid">Post to Facebook</button>
        </form>
      </div>
    </div>
  </div>
